<div class="chat-window-container" *ngIf="activeChat; else emptyState">
    <!-- Header -->
    <header class="chat-header">
        <div class="chat-header-info">
            <app-avatar [src]="chatAvatar" [alt]="chatName" [size]="40"></app-avatar>
            <div class="chat-header-text">
                <span class="chat-header-name">{{ chatName }}</span>
                <!-- <span class="chat-header-status" *ngIf="!activeChat.isGroup">click here for contact info</span> -->
                <span class="chat-header-status" *ngIf="activeChat.isGroup">
                    <ng-container *ngFor="let p of activeChat.participants; let last=last">
                        {{ p.name }}{{ !last ? ', ' : '' }}
                    </ng-container>
                </span>
            </div>
        </div>
        <!-- <div class="chat-header-actions">
            <button class="action-btn" title="Search"><app-icon name="search" [size]="24"></app-icon></button>
            <button class="action-btn" title="Menu"><app-icon name="menu" [size]="24"></app-icon></button>
        </div> -->
    </header>

    <!-- Messages Area -->
    <div class="chat-messages-container">
        <div class="chat-messages-bg"></div>
        <div class="chat-messages">
            <div class="message-wrapper" *ngFor="let msg of messages$ | async"
                [class.message-sent]="(msg.userid || msg.senderId)?.toString() === currentUserId.toString()"
                [class.message-received]="(msg.userid || msg.senderId)?.toString() !== currentUserId.toString()">

                <div class="message-bubble">
                    <!-- Tail logic for received/sent -->
                    <span class="message-tail-in"
                        *ngIf="(msg.userid || msg.senderId)?.toString() !== currentUserId.toString()">
                        <svg viewBox="0 0 8 13" width="8" height="13">
                            <path opacity=".13" d="M5.188 1H0v11.193l6.467-8.625C7.526 2.156 6.958 1 5.188 1z"></path>
                            <path fill="currentColor" d="M5.188 0H0v11.193l6.467-8.625C7.526 1.156 6.958 0 5.188 0z">
                            </path>
                        </svg>
                    </span>
                    <span class="message-tail-out"
                        *ngIf="(msg.userid || msg.senderId)?.toString() === currentUserId.toString()">
                        <svg viewBox="0 0 8 13" width="8" height="13">
                            <path opacity=".13" fill="#0000000"
                                d="M5.188 1H0v11.193l6.467-8.625C7.526 2.156 6.958 1 5.188 1z"></path>
                            <path fill="currentColor" d="M5.188 0H0v11.193l6.467-8.625C7.526 1.156 6.958 0 5.188 0z">
                            </path>
                        </svg>
                    </span>

                    <span class="message-sender"
                        *ngIf="activeChat.isGroup && (msg.userid || msg.senderId)?.toString() !== currentUserId.toString()">
                        <!-- For group chats we show who sent it -->
                        Someone
                    </span>

                    <span dir="ltr" class="message-content">{{ msg.content }}</span>

                    <div class="message-meta">
                        <span class="message-time">{{ msg.created_at | date:'shortTime' }}</span>
                        <!-- <span class="message-status" *ngIf="msg.userid === currentUserId">
                            <svg viewBox="0 0 16 15" width="16" height="15" fill="var(--wa-icon-color)"
                                *ngIf="msg.status === 'read'">
                                <path
                                    d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.32.32 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"
                                    fill="var(--wa-primary-light)"></path>
                            </svg>
                            <svg viewBox="0 0 11 12" width="11" height="12" fill="var(--wa-icon-color)"
                                *ngIf="msg.status === 'sent'">
                                <path
                                    d="M4.606 10.957L.414 7.397a.401.401 0 0 1 .012-.598l.587-.514a.39.39 0 0 1 .59.02l2.96 2.502L9.366 2.585a.4.4 0 0 1 .593-.03l.542.48a.395.395 0 0 1 .035.589L4.606 10.957z">
                                </path>
                            </svg>
                        </span> -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <footer class="chat-footer">
        <!-- <div class="chat-footer-tools">
            <button class="action-btn" title="Smiley"><app-icon name="smiley" [size]="26"></app-icon></button>
            <button class="action-btn" title="Attach"><app-icon name="attach" [size]="24"></app-icon></button>
        </div> -->
        <div class="chat-input-container">
            <input type="text" class="chat-input" placeholder="Type a message" [(ngModel)]="newMessage"
                (keydown)="onKeydown($event)">
        </div>
        <div class="chat-footer-tools">
            <button class="action-btn" *ngIf="newMessage.trim()" (click)="sendMessage()" title="Send">
                <app-icon name="send" [size]="24"></app-icon>
            </button>
            <!-- Assume Microphone icon if empty, but we show Send for simplicity if empty too. Just hardcode Send -->
            <button class="action-btn" *ngIf="!newMessage.trim()" title="Send">
                <app-icon name="send" [size]="24"></app-icon>
            </button>
        </div>
    </footer>
</div>

<ng-template #emptyState>
    <div class="empty-state">
        <div class="empty-icon">
            <!-- Embedded SVG as placeholder -->
        </div>
    </div>
</ng-template>
