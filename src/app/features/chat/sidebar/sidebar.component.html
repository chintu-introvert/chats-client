<div class="sidebar-container">
    <!-- Header -->
    <header class="sidebar-header">
        <div class="header-user">
            <app-avatar [src]="currentUser$.avatarUrl" [alt]="currentUser$.name" [size]="40"></app-avatar>
        </div>
        <div class="header-actions">
            <button class="action-btn" title="Status" aria-label="Status">
                <app-icon name="status" [size]="24"></app-icon>
            </button>
            <button class="action-btn" title="New Chat" aria-label="New Chat">
                <app-icon name="chat" [size]="24"></app-icon>
            </button>
            <button class="action-btn" title="Menu" aria-label="Menu">
                <app-icon name="menu" [size]="24"></app-icon>
            </button>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="sidebar-search-container">
        <div class="search-input-wrapper">
            <div class="search-icon">
                <app-icon name="search" [size]="20"></app-icon>
            </div>
            <input type="text" placeholder="Search or start new chat" class="search-input">
        </div>
    </div>

    <!-- Chat List -->
    <div class="sidebar-content">
        <app-chat-list></app-chat-list>
    </div>
</div>
