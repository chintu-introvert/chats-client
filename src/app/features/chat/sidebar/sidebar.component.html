<div class="sidebar-container">
    <!-- Header -->
    <header class="sidebar-header">
        <div class="header-user">
            <app-avatar [src]="currentUser$.avatarUrl" [alt]="currentUser$.name" [size]="42"></app-avatar>
            <div class="header-user-info">
                <span class="header-username">{{ currentUser$.name }}</span>
                <span class="header-bio">{{ userBio }}</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="action-btn" title="New Chat" aria-label="New Chat">
                <app-icon name="chat" [size]="22"></app-icon>
            </button>
            <button type="button" class="action-btn" title="Log out" aria-label="Log out" (click)="logout()">
                <app-icon name="logout" [size]="22"></app-icon>
            </button>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="sidebar-search-container">
        <div class="search-input-wrapper">
            <div class="search-icon">
                <app-icon name="search" [size]="18"></app-icon>
            </div>
            <input type="text" [(ngModel)]="searchQuery" placeholder="Search or start a new chat" class="search-input">
        </div>
    </div>

    <!-- Chat List / Search Results -->
    <div class="sidebar-content">
        <app-chat-list *ngIf="!searchQuery"></app-chat-list>

        <!-- Search Results -->
        <div class="search-results-container" *ngIf="searchQuery">
            <div class="search-results-header">Users</div>

            <div class="user-list-item" *ngFor="let user of filteredUsers" (click)="startChat(user)">
                <app-avatar [src]="user.avatarUrl" [alt]="user.name" [size]="48"></app-avatar>
                <div class="user-info">
                    <span class="user-name">{{ user.name }}</span>
                    <span class="user-status">{{ user.status || 'Available' }}</span>
                </div>
            </div>

            <div *ngIf="filteredUsers.length === 0" class="no-results">
                No users found for "{{ searchQuery }}"
            </div>
        </div>
    </div>
</div>
